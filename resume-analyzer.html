<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Analysis System</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica', 'Arial', sans-serif;
        }
        body {
            background: #ffffff;
            color: #000000;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // Configure PDF.js worker
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        function ResumeAnalyzer() {
            const [resumeFile, setResumeFile] = useState(null);
            const [resumeText, setResumeText] = useState('');
            const [jobDescription, setJobDescription] = useState('');
            const [jobDescFile, setJobDescFile] = useState(null);
            const [analysis, setAnalysis] = useState(null);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');
            const [apiKey, setApiKey] = useState('');

            // Extract text from PDF
            const extractPdfText = async (file) => {
                try {
                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                    let fullText = '';

                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const textContent = await page.getTextContent();
                        const pageText = textContent.items.map(item => item.str).join(' ');
                        fullText += pageText + '\n';
                    }

                    return fullText;
                } catch (err) {
                    throw new Error('Failed to extract PDF text: ' + err.message);
                }
            };

            // Extract text from DOCX
            const extractDocxText = async (file) => {
                try {
                    const arrayBuffer = await file.arrayBuffer();
                    const result = await mammoth.extractRawText({ arrayBuffer });
                    return result.value;
                } catch (err) {
                    throw new Error('Failed to extract DOCX text: ' + err.message);
                }
            };

            // Handle resume file upload
            const handleResumeUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                setResumeFile(file);
                setError('');

                try {
                    let text = '';
                    if (file.name.endsWith('.pdf')) {
                        text = await extractPdfText(file);
                    } else if (file.name.endsWith('.docx')) {
                        text = await extractDocxText(file);
                    } else if (file.name.endsWith('.txt')) {
                        text = await file.text();
                    } else {
                        setError('Unsupported file format. Please upload PDF, DOCX, or TXT.');
                        return;
                    }

                    setResumeText(text);
                } catch (err) {
                    setError(err.message);
                }
            };

            // Handle job description file upload
            const handleJobDescUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                setJobDescFile(file);
                setError('');

                try {
                    let text = '';
                    if (file.name.endsWith('.pdf')) {
                        text = await extractPdfText(file);
                    } else if (file.name.endsWith('.docx')) {
                        text = await extractDocxText(file);
                    } else if (file.name.endsWith('.txt')) {
                        text = await file.text();
                    } else {
                        setError('Unsupported file format. Please upload PDF, DOCX, or TXT.');
                        return;
                    }

                    setJobDescription(text);
                } catch (err) {
                    setError(err.message);
                }
            };

            // Analyze resume using Claude API
            const analyzeResume = async () => {
                if (!resumeText.trim()) {
                    setError('Please upload a resume file.');
                    return;
                }

                if (!jobDescription.trim()) {
                    setError('Please provide a job description.');
                    return;
                }

                if (!apiKey.trim()) {
                    setError('Please provide your Anthropic API key.');
                    return;
                }

                setLoading(true);
                setError('');
                setAnalysis(null);

                const systemPrompt = `You are a Resume Analysis System. You compare resumes against job descriptions, rate quality, and provide critical feedback. You verify claims where possible and flag uncertainty when data is insufficient.

Instructions:
1. Extract & Parse: Analyze the provided resume and job description text.
2. Match Analysis: Identify required skills, experience, and qualifications in the job description and cross-reference with resume content.
3. Output a table with: Requirement | Match Status (✓ Present, ✗ Missing, ~ Partial) | Evidence
4. Rating (0–100 scale):
   - Skills Match: % of required skills present
   - Experience Relevance: alignment of past roles with job requirements
   - Clarity & Structure: formatting, readability, conciseness
   - Impact & Quantification: presence of measurable achievements
   - Overall Score: weighted average
5. Critical Feedback: List specific weaknesses with no filler, only actionable deficiencies.

Output format:
## Match Analysis
[Table with requirements, match status, and evidence]

## Ratings
- Skills Match: X/100
- Experience Relevance: X/100
- Clarity & Structure: X/100
- Impact & Quantification: X/100
- **Overall: X/100**

## Critical Feedback
[Bulleted list of specific flaws]

Be blunt, direct, and factual. Do not fabricate matches. If uncertain, mark as "Insufficient data."`;

                const userPrompt = `Resume:\n${resumeText}\n\nJob Description:\n${jobDescription}`;

                try {
                    const response = await fetch('https://api.anthropic.com/v1/messages', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'x-api-key': apiKey,
                            'anthropic-version': '2023-06-01'
                        },
                        body: JSON.stringify({
                            model: 'claude-3-5-sonnet-20241022',
                            max_tokens: 4096,
                            system: systemPrompt,
                            messages: [{
                                role: 'user',
                                content: userPrompt
                            }]
                        })
                    });

                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.error?.message || 'API request failed');
                    }

                    const data = await response.json();
                    const analysisText = data.content[0].text;
                    setAnalysis(analysisText);
                } catch (err) {
                    setError('Analysis failed: ' + err.message);
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="min-h-screen bg-white">
                    {/* Navigation */}
                    <nav className="border-b border-gray-300">
                        <div className="max-w-4xl mx-auto px-4 py-4">
                            <a href="index.html" className="text-black hover:text-gray-600 font-medium">
                                ← Back to Portfolio
                            </a>
                        </div>
                    </nav>

                    <div className="max-w-4xl mx-auto py-12 px-4">
                        {/* Header */}
                        <h1 className="text-2xl font-bold mb-12 text-black">Resume Analysis</h1>

                        {/* API Key Input */}
                        <div className="mb-8">
                            <label className="block text-sm font-medium mb-2 text-black">
                                Anthropic API Key
                            </label>
                            <input
                                type="password"
                                value={apiKey}
                                onChange={(e) => setApiKey(e.target.value)}
                                placeholder="sk-ant-..."
                                className="w-full px-4 py-2 border border-gray-400 bg-white text-black focus:outline-none focus:border-black"
                            />
                        </div>

                        {/* Resume Upload */}
                        <div className="mb-8">
                            <label className="block text-sm font-medium mb-2 text-black">
                                Resume (PDF, DOCX, or TXT)
                            </label>
                            <input
                                type="file"
                                accept=".pdf,.docx,.txt"
                                onChange={handleResumeUpload}
                                className="w-full px-4 py-2 border border-gray-400 bg-white text-black focus:outline-none focus:border-black"
                            />
                            {resumeText && (
                                <p className="mt-2 text-sm text-gray-600">
                                    Extracted {resumeText.length} characters
                                </p>
                            )}
                        </div>

                        {/* Job Description Input */}
                        <div className="mb-8">
                            <label className="block text-sm font-medium mb-2 text-black">
                                Job Description
                            </label>
                            <textarea
                                value={jobDescription}
                                onChange={(e) => setJobDescription(e.target.value)}
                                placeholder="Paste job description here..."
                                rows={8}
                                className="w-full px-4 py-2 border border-gray-400 bg-white text-black focus:outline-none focus:border-black resize-none"
                            />
                            <div className="mt-2">
                                <label className="text-sm text-gray-600">
                                    Or upload file:
                                </label>
                                <input
                                    type="file"
                                    accept=".pdf,.docx,.txt"
                                    onChange={handleJobDescUpload}
                                    className="ml-2 text-sm"
                                />
                            </div>
                        </div>

                        {/* Error Message */}
                        {error && (
                            <div className="mb-8 p-4 border border-black bg-gray-100">
                                <p className="text-black font-medium">Error: {error}</p>
                            </div>
                        )}

                        {/* Analyze Button */}
                        <button
                            onClick={analyzeResume}
                            disabled={loading}
                            className="w-full py-3 bg-black text-white font-medium hover:bg-gray-800 disabled:bg-gray-400 disabled:cursor-not-allowed mb-12"
                        >
                            {loading ? 'Analyzing...' : 'Analyze'}
                        </button>

                        {/* Analysis Results */}
                        {analysis && (
                            <div className="border-t border-gray-400 pt-12">
                                <AnalysisDisplay analysis={analysis} />
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        function AnalysisDisplay({ analysis }) {
            // Parse the markdown-like analysis into sections
            const sections = analysis.split('##').filter(s => s.trim());

            return (
                <div className="space-y-12">
                    {sections.map((section, idx) => {
                        const lines = section.trim().split('\n');
                        const title = lines[0].trim();
                        const content = lines.slice(1).join('\n').trim();

                        if (title === 'Match Analysis') {
                            return <MatchAnalysisSection key={idx} content={content} />;
                        } else if (title === 'Ratings') {
                            return <RatingsSection key={idx} content={content} />;
                        } else if (title === 'Critical Feedback') {
                            return <FeedbackSection key={idx} content={content} />;
                        }
                        return null;
                    })}
                </div>
            );
        }

        function MatchAnalysisSection({ content }) {
            return (
                <div>
                    <h2 className="text-xl font-bold mb-6 text-black">Match Analysis</h2>
                    <div className="overflow-x-auto">
                        <div className="whitespace-pre-wrap font-mono text-sm text-black border border-gray-400 p-4">
                            {content}
                        </div>
                    </div>
                </div>
            );
        }

        function RatingsSection({ content }) {
            return (
                <div>
                    <h2 className="text-xl font-bold mb-6 text-black">Ratings</h2>
                    <div className="space-y-3">
                        {content.split('\n').filter(line => line.trim()).map((line, idx) => {
                            const cleaned = line.replace(/^[-*]\s*/, '').trim();
                            const isOverall = cleaned.includes('**Overall');

                            return (
                                <div
                                    key={idx}
                                    className={`text-black ${isOverall ? 'font-bold text-lg mt-4' : ''}`}
                                >
                                    {cleaned.replace(/\*\*/g, '')}
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        }

        function FeedbackSection({ content }) {
            return (
                <div>
                    <h2 className="text-xl font-bold mb-6 text-black">Critical Feedback</h2>
                    <ul className="space-y-4 list-none">
                        {content.split('\n').filter(line => line.trim()).map((line, idx) => {
                            const cleaned = line.replace(/^[-*]\s*/, '').trim();
                            return (
                                <li key={idx} className="text-black leading-relaxed pl-0">
                                    • {cleaned}
                                </li>
                            );
                        })}
                    </ul>
                </div>
            );
        }

        ReactDOM.render(<ResumeAnalyzer />, document.getElementById('root'));
    </script>
</body>
</html>
