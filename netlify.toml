# Netlify configuration
[build]
  # No build command needed - static HTML files
  publish = "."

[[headers]]
  # Apply headers to all routes
  for = "/*"
  [headers.values]
    # Security headers
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Allow external API calls (Anthropic)
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; connect-src 'self' https://api.anthropic.com; img-src 'self' data:; font-src 'self' data:;"

# Redirect rules (if needed)
[[redirects]]
  from = "/resume"
  to = "/resume-analyzer.html"
  status = 301

# Custom 404 page (optional)
# [[redirects]]
#   from = "/*"
#   to = "/index.html"
#   status = 404
